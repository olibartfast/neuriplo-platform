name: Platform Check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python3 -m pip install pyyaml

      - name: Validate platform metadata
        run: scripts/check_platform.py

      - name: Validate benchmark baseline references
        run: scripts/check_benchmark_baseline.py versions.yaml

      - name: Verify compatibility report is up to date
        run: scripts/generate_compat_report.py --check

      - name: Validate failure-mode contract matrix
        run: integration-tests/failure-modes/run.py
