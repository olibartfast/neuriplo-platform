compatibility_sets:
  - name: rfdetr-keypoint-pose-followup
    status: superseded
    # Structured, human-attested evidence for the GPU/C++ checks that platform
    # metadata CI cannot run (configure, build, unit tests, inference smoke).
    # The report generator validates this file and renders it; it does not
    # re-execute the attested checks.
    # Moved 2026-10-23: the live evidence file and baselines now live at
    # neuriplo-infer/integration-tests/rfdetr-pose-local-vs-kserve/
    # (evidence.yaml, baselines/local.json, baselines/kserve-grpc.json).
    # This set is superseded; the historical notes below are retained.
    notes:
      - "Matrix refresh 2026-10-26: neuriplo v0.11.1, neuriplo-infer v0.11.2, videocapture v0.6.1. This set retains its historical evidence; live scenario compatibility has not been re-attested at these pins."
      - "Moved 2026-10-23: the live evidence file now lives at neuriplo-infer/integration-tests/rfdetr-pose-local-vs-kserve/evidence.yaml."
      - "Historical evidence: neuriplo-tasks v0.5.0 adds the RfDetrPose task family (RF-DETR keypoint pose) and batch support across postprocessors; public header changes are additive only (new RfDetrPosePostprocessor header, Keypoint visibility/covariance fields, and a private enum enumerator)."
      - "Historical evidence: neuriplo-infer v0.8.0 routes the new rfdetrpose/rfdetrkeypoint/rfdetrkpt type strings to PoseEstimation and defaults the KServe remote-runtime client to gRPC."
      - "Historical evidence: validated by a full release build of neuriplo-infer v0.8.0 against the pinned sibling tags fetched from GitHub (local backends plus KServe gRPC, OpenCV-DNN backend): 29 of 29 app tests pass."
      - "Historical evidence: neuriplo-kserve-runtime v0.3.2 is unchanged since its tag and was not rebuilt; compatibility with neuriplo-tasks v0.5.0 follows from the additive, pose-only contract change the runtime does not consume."
      - "The matrix now pins neuriplo v0.10.0, neuriplo-infer v0.10.2, and videocapture v0.6.0 (2026-10-03). This superseded set's evidence was attested at the older pins (neuriplo-tasks v0.6.1 / neuriplo v0.8.0) and is retained as history; it is not re-attested against the newer pins."
      - "The matrix now pins neuriplo-kserve-runtime v0.4.0 and neuriplo-infer v0.10.3 (2026-10-05). This set's evidence predates those pins and is not re-attested against them; runtime v0.4.0 is attested only by kserve-encoded-image-v040."
    repositories:
      neuriplo-tasks: v0.8.2
      neuriplo: v0.11.1
      neuriplo-infer: v0.11.2
      neuriplo-kserve-client: v0.4.0
      neuriplo-kserve-runtime: v0.4.0
      videocapture: v0.6.1
    benchmark_baselines: []
    # Moved 2026-10-23: live baselines now live under
    # neuriplo-infer/integration-tests/rfdetr-pose-local-vs-kserve/baselines/.
  - name: ecdet-kserve-litert-followup
    status: draft
    notes:
      - "Matrix refresh 2026-10-26: neuriplo v0.11.1, neuriplo-infer v0.11.2, videocapture v0.6.1. This set retains its historical evidence; live scenario compatibility has not been re-attested at these pins."
      - "Moved 2026-10-23: the live baseline now lives at neuriplo-infer/integration-tests/kserve-runtime-edgecrafter-e2e/baselines/http.json."
      - EdgeCrafter ecdet remains validated across ONNX Runtime, TensorRT, OpenVINO, and ExecuTorch.
      - neuriplo adds LiteRT custom kernels needed by the converted ecdet graph, but ecdet TFLite remains excluded because ONNX-to-TFLite conversion fidelity is known bad.
      - neuriplo-infer documents the ecdet TFLite limitation and keeps the LiteRT warning in the E2E helper.
      - kserve client and runtime docs clarify GitFlow branch cleanup rules used during release maintenance.
      - Carried forward to the current repository versions; pending re-validation at this snapshot.
      - The matrix now pins neuriplo v0.10.0, neuriplo-infer v0.10.2, and videocapture v0.6.0 (2026-10-03); this draft's evidence predates those pins and re-validation at this snapshot is still pending.
      - "The matrix now pins neuriplo-kserve-runtime v0.4.0 and neuriplo-infer v0.10.3 (2026-10-05). This set's evidence predates those pins and is not re-attested against them; runtime v0.4.0 is attested only by kserve-encoded-image-v040."
    repositories:
      neuriplo-tasks: v0.8.2
      neuriplo: v0.11.1
      neuriplo-infer: v0.11.2
      neuriplo-kserve-client: v0.4.0
      neuriplo-kserve-runtime: v0.4.0
      videocapture: v0.6.1
    benchmark_baselines: []
    # Moved 2026-10-23: the live baseline now lives at
    # neuriplo-infer/integration-tests/kserve-runtime-edgecrafter-e2e/baselines/http.json.
  - name: opencv-boundary-v060
    status: active
    evidence: integration-tests/opencv-boundary-v060/evidence.yaml
    notes:
      - "Matrix refresh 2026-10-26: neuriplo v0.11.1, neuriplo-infer v0.11.2, videocapture v0.6.1. This set retains its historical evidence; live scenario compatibility has not been re-attested at these pins."
      - neuriplo-tasks v0.6.0 moves public task contracts to native vision types and makes OpenCV interop optional through neuriplo-tasks::vision-opencv.
      - neuriplo-infer v0.9.0 contains the validated OpenCV-boundary migration; all 29 CTest tests passed against the published neuriplo-tasks tag.
      - tritonic v0.3.0 contains the validated OpenCV-boundary migration; all 50 CTest tests passed against the published neuriplo-tasks tag.
      - neuriplo-track master at dde8e5a0d500cef09bd153161e9cfaa21889b532 was clean-configured against the published tag; its CLI help smoke passed.
      - The matrix now pins neuriplo-tasks v0.8.2, neuriplo v0.10.0, neuriplo-infer v0.10.2, and videocapture v0.6.0 (2026-10-03). The OpenCV-boundary contract is unchanged by those releases (neuriplo-tasks v0.8.2 adds image-input preprocessing behavior; neuriplo v0.10.0 hardens the plugin loader and adds a consumer C ABI; videocapture v0.6.0 moves encoding onto the writer thread; none touch the task-contract boundary), so the v0.6.0/v0.9.0 boundary evidence carries forward; the newer behavior is not covered by this set.
      - "The matrix now pins neuriplo-kserve-runtime v0.4.0 and neuriplo-infer v0.10.3 (2026-10-05). This set's evidence predates those pins and is not re-attested against them; runtime v0.4.0 is attested only by kserve-encoded-image-v040."
    repositories:
      neuriplo-tasks: v0.8.2
      neuriplo: v0.11.1
      neuriplo-infer: v0.11.2
      neuriplo-kserve-client: v0.4.0
      neuriplo-kserve-runtime: v0.4.0
      videocapture: v0.6.1
  - name: kserve-encoded-image-v040
    status: active
    # V-7 of specs/2026-10-03-kserve-dynamic-dim-encoded-image: encoded-image
    # requests served by a runtime ensemble whose input declares a dynamic
    # dimension, over HTTP and gRPC, with server- and client-side postprocess.
    evidence: integration-tests/kserve-ensemble/evidence-encoded-image-v040.yaml
    notes:
      - "Matrix refresh 2026-10-26: neuriplo v0.11.1, neuriplo-infer v0.11.2, videocapture v0.6.1. This set retains its historical evidence; live scenario compatibility has not been re-attested at these pins."
      - neuriplo-kserve-runtime v0.4.0 treats a negative metadata dimension as a wildcard and serves pipeline (ensemble) models; v0.3.2 refuses the ensemble load.
      - neuriplo-infer v0.10.3 is a docs-only patch over v0.10.2; its encoded-image client path is unchanged and was exercised against the v0.4.0 tag.
      - The four transport x postprocess-mode runs render pixel-identical outputs.
    repositories:
      neuriplo-tasks: v0.8.2
      neuriplo: v0.11.1
      neuriplo-infer: v0.11.2
      neuriplo-kserve-client: v0.4.0
      neuriplo-kserve-runtime: v0.4.0
      videocapture: v0.6.1

