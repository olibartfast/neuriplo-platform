compatibility_sets:
  - name: rfdetr-keypoint-pose-followup
    status: active
    notes:
      - neuriplo-tasks v0.5.0 adds the RfDetrPose task family (RF-DETR keypoint pose) and batch support across postprocessors; public header changes are additive only (new RfDetrPosePostprocessor header, Keypoint visibility/covariance fields, and a private enum enumerator).
      - neuriplo-infer v0.8.0 routes the new rfdetrpose/rfdetrkeypoint/rfdetrkpt type strings to PoseEstimation and defaults the KServe remote-runtime client to gRPC.
      - Validated by a full release build of neuriplo-infer v0.8.0 against the pinned sibling tags fetched from GitHub (local backends plus KServe gRPC, OpenCV-DNN backend): 29 of 29 app tests pass.
      - neuriplo-kserve-runtime v0.3.2 is unchanged since its tag and was not rebuilt; compatibility with neuriplo-tasks v0.5.0 follows from the additive, pose-only contract change the runtime does not consume.
    repositories:
      neuriplo-tasks: v0.5.0
      neuriplo: v0.8.0
      neuriplo-infer: v0.8.0
      neuriplo-kserve-client: v0.4.0
      neuriplo-kserve-runtime: v0.3.2
      videocapture: v0.3.0
  - name: ecdet-kserve-litert-followup
    status: draft
    notes:
      - EdgeCrafter ecdet remains validated across ONNX Runtime, TensorRT, OpenVINO, and ExecuTorch.
      - neuriplo adds LiteRT custom kernels needed by the converted ecdet graph, but ecdet TFLite remains excluded because ONNX-to-TFLite conversion fidelity is known bad.
      - neuriplo-infer documents the ecdet TFLite limitation and keeps the LiteRT warning in the E2E helper.
      - kserve client and runtime docs clarify GitFlow branch cleanup rules used during release maintenance.
      - Carried forward to the current repository versions; pending re-validation at this snapshot.
    repositories:
      neuriplo-tasks: v0.5.0
      neuriplo: v0.8.0
      neuriplo-infer: v0.8.0
      neuriplo-kserve-client: v0.4.0
      neuriplo-kserve-runtime: v0.3.2
      videocapture: v0.3.0
